name: SpendWise CI and Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: spendwise-app

jobs:
  validate:
    name: Validate source and Docker configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f Dockerfile
          test -f nginx.conf
          test -f .dockerignore

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'styles.css' index.html
          grep -Fq 'app.js' index.html
          grep -Fq 'chart.umd.min.js' index.html
          ! grep -Eq '(src|href)="/(styles\.css|app\.js)' index.html

      - name: Check Dockerfile inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'FROM nginx:1.27-alpine' Dockerfile
          grep -Fq 'COPY nginx.conf /etc/nginx/conf.d/default.conf' Dockerfile
          grep -Fq '.git' .dockerignore
          grep -Fq '.env' .dockerignore

  docker-publish:
    name: Build and publish Docker image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy:
    name: Deploy on Windows self-hosted runner
    needs: docker-publish
    runs-on: [self-hosted, windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Log in and pull published image
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          $env:DOCKERHUB_TOKEN | docker login --username $env:DOCKERHUB_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Docker Hub login failed.' }
          try {
            docker pull $env:DOCKER_IMAGE
            if ($LASTEXITCODE -ne 0) { throw "Docker pull failed for $env:DOCKER_IMAGE" }
          } finally {
            docker logout | Out-Null
          }

      - name: Replace SpendWise container with rollback protection
        shell: powershell
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: .github/scripts/deploy-self-hosted.ps1 -Image $env:DOCKER_IMAGE -Port 8080 -CandidatePort 18080

      - name: Verify deployed container
        shell: powershell
        run: |
          docker ps --filter "name=^spendwise$" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker inspect --format '{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}unavailable{{end}}' spendwise
          $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/
          if ($response.StatusCode -ne 200) { throw "SpendWise returned HTTP $($response.StatusCode)" }

      - name: Show deployment logs on failure
        if: failure()
        shell: powershell
        run: |
          docker ps -a --filter "name=spendwise" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          docker logs spendwise 2>&1
