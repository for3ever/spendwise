name: SpendWise CI and Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: spendwise-app

jobs:
  validate:
    name: Validate source and Docker configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f Dockerfile
          test -f nginx.conf
          test -f .dockerignore

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'styles.css' index.html
          grep -Fq 'app.js' index.html
          grep -Fq 'chart.umd.min.js' index.html
          ! grep -Eq '(src|href)="/(styles\.css|app\.js)' index.html

      - name: Check Dockerfile inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'FROM nginx:1.27-alpine' Dockerfile
          grep -Fq 'COPY nginx.conf /etc/nginx/conf.d/default.conf' Dockerfile
          grep -Fq '.git' .dockerignore
          grep -Fq '.env' .dockerignore

  docker-publish:
    name: Build and publish Docker image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
