server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the static app usable under direct navigation and future client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }
}
